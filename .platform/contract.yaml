apiVersion: platform.contract/v0.5
kind: Unit
metadata:
  name: sos
  contract_version: "0.5"
build:
  strategy: command
  command: ["true"]
  artifact: "./platform_run.py"
run:
  entrypoint: ["python3", "./platform_run.py"]
adapters:
  transport: vsock
listen:
  ports:
    - name: http
      port: 18280
      protocol: tcp
      expose: public
probes:
  startup:
    type: http
    port: 18280
    path: /health
    deadline_ms: 30000
  readiness:
    type: http
    port: 18280
    path: /health
lifecycle:
  stop_grace_ms: 5000
replicas:
  interchangeability: stateless
  min: 1
  max: 1
controls:
  labels:
    data_class: none
  network:
    egress: platform
  budget_class: default
